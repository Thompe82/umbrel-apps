version: '3.7'

services:
  app_proxy:
    environment:
      APP_HOST: bc3-forge_dashboard_1
      APP_PORT: 3000
    container_name: bc3-forge_app_proxy_1

  dashboard:
    image: >-
      nginx:1.25.3@sha256:4c0fdaa8b6341bfdeca5f18f7837462c80cff90527ee35ef185571e1c327beac
    restart: on-failure
    stop_grace_period: 10s
    volumes:
      - /run/bc3-dashboard:/run/bc3-dashboard
      - /home/umbrel/bc3-dashboard/nginx.conf:/etc/nginx/nginx.conf:ro
    container_name: bc3-forge_dashboard_1
